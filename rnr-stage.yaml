yaml_version: 1

stage: execute

modules:

  if_stage:
    source_files:
      - IF_Stage/if_stage.sv

  decoder:
    source_files:
      - Decoder/decoder.sv

  imm_generator:
    source_files:
      - Immediate_Generator/imm_generator.sv

  register_file:
    source_files:
      - Register_File/regfile.sv
    top_module: regfile
    ports:
      rs1_sel: a1
      rs2_sel: a2
      reg_write: we3
      clk: clk
      reset: reset
      wb_data: wd3
      rd_sel: a3
      rs1_data: rd1
      rs2_data: rd2

  main_control:
    source_files:
      - Main_Control/controller.sv

  id_stage:
    source_files:
      - ID_Stage/id_stage.sv

  alu:
    source_files:
      - ALU/alu.sv

  alu_control:
    source_files:
      - ALU_Control/alu_decoder.sv

  ex_stage:
    source_files:
      - EX_Stage/ex_stage.sv


